/* ------------------------------- acacia trees -------------------------------------- */
/* Short forking trunk, branches sweeping out and up, and a flat umbrella crown of
   horizontal leaf cards. */
function growAcacia(rand, spec){
  const cyls = [], cards = [];
  const H = spec.height, R = spec.crownR;
  const forkY = H * 0.32;
  cyls.push(cylBetween(V3(0, -0.3, 0), V3((rand() - 0.5) * 0.4, forkY, (rand() - 0.5) * 0.4), spec.r, spec.r * 0.75, 8, 0, 0.1));
  const nB = 4 + Math.floor(rand() * 3);
  const crownC = V3(0, H, 0);
  for (let b = 0; b < nB; b++){
    const a = b / nB * Math.PI * 2 + rand() * 0.8;
    let p = V3(0, forkY, 0), r = spec.r * 0.55;
    let dir = V3(Math.cos(a) * 0.8, 1.0, Math.sin(a) * 0.8).normalize();
    const segs = 4;
    const reach = R * (0.55 + rand() * 0.5);
    for (let s = 0; s < segs; s++){
      const t = (s + 1) / segs;
      /* sweep outward then flatten toward the crown plane */
      dir.y = lerpN(1.0, 0.15, t) + (rand() - 0.5) * 0.2;
      dir.x = Math.cos(a) * lerpN(0.8, 1.3, t) + (rand() - 0.5) * 0.3;
      dir.z = Math.sin(a) * lerpN(0.8, 1.3, t) + (rand() - 0.5) * 0.3;
      dir.normalize();
      const len = (H - forkY) * 0.42 * (1 - t * 0.25) + reach * 0.22;
      const np = p.clone().addScaledVector(dir, len);
      cyls.push(cylBetween(p, np, r, r * 0.6, 6, 0, r));
      /* twigs holding leaf cards near the top of the crown */
      if (s >= 2){
        const nC = 5 + Math.floor(rand() * 3);
        for (let c = 0; c < nC; c++){
          const cp = np.clone().add(V3((rand() - 0.5) * R * 0.5, (rand() - 0.5) * 1.2 + 0.6, (rand() - 0.5) * R * 0.5));
          cp.y = Math.min(cp.y, H + 0.6);
          const card = new THREE.PlaneGeometry(spec.card * (0.8 + rand() * 0.5), spec.card * (0.8 + rand() * 0.5));
          card.rotateX(-Math.PI / 2 + (rand() - 0.5) * 0.5);
          card.rotateY(rand() * Math.PI * 2);
          card.translate(cp.x, cp.y, cp.z);
          const nn = card.attributes.normal, pp = card.attributes.position;
          for (let k = 0; k < pp.count; k++){
            const o = V3(pp.getX(k) - crownC.x, 3.0, pp.getZ(k) - crownC.z).normalize();
            nn.setXYZ(k, o.x, o.y, o.z);
          }
          cards.push(card);
        }
      }
      p = np; r *= 0.62;
    }
  }
  /* the umbrella: a dense flat disc of cards over the whole crown */
  const nDisc = Math.round(spec.disc);
  for (let i = 0; i < nDisc; i++){
    const rr = R * Math.sqrt(rand()) * 1.05, a = rand() * Math.PI * 2;
    const cp = V3(Math.cos(a) * rr, H + 0.3 - (rr / R) * (rr / R) * 1.4 + (rand() - 0.5) * 0.8, Math.sin(a) * rr);
    const card = new THREE.PlaneGeometry(spec.card * (0.8 + rand() * 0.5), spec.card * (0.8 + rand() * 0.5));
    card.rotateX(-Math.PI / 2 + (rand() - 0.5) * 0.6);
    card.rotateY(rand() * Math.PI * 2);
    card.translate(cp.x, cp.y, cp.z);
    const nn = card.attributes.normal, pp = card.attributes.position;
    for (let k = 0; k < pp.count; k++){
      const o = V3(pp.getX(k), 2.5, pp.getZ(k)).normalize();
      nn.setXYZ(k, o.x, o.y, o.z);
    }
    cards.push(card);
  }
  return { trunk: safeMerge(cyls), leaves: safeMerge(cards) };
}
function buildAcacias(){
  const gr = mulberry32(6161);
  const specs = [];
  for (let i = 0; i < 4; i++) specs.push(growAcacia(mulberry32(1200 + i), {
    height: 7 + gr() * 3.5, crownR: 5 + gr() * 2.5, r: 0.28 + gr() * 0.12, card: 2.3, disc: 46 }));
  const small = [];
  for (let i = 0; i < 3; i++) small.push(growAcacia(mulberry32(1300 + i), {
    height: 2.2 + gr() * 1.2, crownR: 1.5 + gr() * 0.9, r: 0.09, card: 0.9, disc: 14 }));
  const big = specs.map(v => ({ trunk: new Scatter(v.trunk, trunkMat, 140, { layer: 0 }), leaves: new Scatter(v.leaves, broadleafMat, 140, { layer: 2 }) }));
  const sm = small.map(v => ({ trunk: new Scatter(v.trunk, trunkMat, 140, { layer: 1 }), leaves: new Scatter(v.leaves, broadleafMat, 140, { layer: 3 }) }));

  /* scattered on the plain, never on the rock footprint or the trail */
  let cand = poissonDisk(27, SAV.r + 10, rng).map(p => [p[0] + SAV.x, p[1] + SAV.z])
    .filter(([x, z]) => savannaMask(x, z) > 0.55 && !prideFootprint(x, z) && pathDistance(x, z) > 6 && slopeFn(x, z) < 0.4);
  cand = cand.slice(0, Q.acacias);
  for (const [x, z] of cand){
    const v = big[Math.floor(rng() * big.length)];
    const s = 0.8 + rng() * 0.6;
    const m = placeAt(x, z, -0.1, rng() * Math.PI * 2, s, s * (0.9 + rng() * 0.3));
    v.trunk.add(m);
    _c.setHSL(0.21 + rng() * 0.05, 0.42, 0.30 + rng() * 0.10);
    v.leaves.add(m, _c);
    registerTree(x, z, 0.35);
  }
  /* the tree-dotted rear slope of the rock: small acacias where the ridge is gentle */
  let n = 0, attempts = 0;
  const base = savPlainH + PR.yOff;
  while (n < Q.slopeTrees && attempts++ < Q.slopeTrees * 40){
    const lx = 6 + rng() * 104, lz = -28 + rng() * 60;
    const y = ridgeHeight(lx, lz);
    if (y < 0.5) continue;
    const sx = (ridgeHeight(lx + 1, lz) - ridgeHeight(lx - 1, lz)) * 0.5;
    const sz = (ridgeHeight(lx, lz + 1) - ridgeHeight(lx, lz - 1)) * 0.5;
    if (Math.hypot(sx, sz) > 1.8) continue;
    if (rng() < 0.1) continue;
    const v = sm[Math.floor(rng() * sm.length)];
    const s = 0.4 + rng() * 0.5;
    _d.position.set(PR.x + lx, base + y - 0.15, PR.z + lz);
    _d.rotation.set((rng() - 0.5) * 0.15, rng() * Math.PI * 2, (rng() - 0.5) * 0.15);
    _d.scale.set(s, s * (0.9 + rng() * 0.3), s);
    _d.updateMatrix();
    v.trunk.add(_d.matrix);
    _c.setHSL(0.22 + rng() * 0.05, 0.42, 0.28 + rng() * 0.10);
    v.leaves.add(_d.matrix, _c);
    n++;
  }
  for (const v of [...big, ...sm]){ v.trunk.build(worldGroup); v.leaves.build(worldGroup); }
}

/* full rebuild on reseed: dispose all world geometry, keep shared materials */
function rebuildWorld(seed){
  for (const child of [...worldGroup.children]){
    worldGroup.remove(child);
    if (child.geometry) child.geometry.dispose();
    if (child.dispose) child.dispose();
  }
  initNoise(seed);
  treeGrid = new Map();
  const T0 = performance.now();
  buildTerrain();
  buildPrideRock();
  buildTrees();
  buildAcacias();
  buildDeadwood();
  buildUnderstory();
  buildFerns();
  buildGrass();
  buildRocks();
  buildMushrooms();
  buildFlowers();
  buildLitter();
  console.log('[forest] world built in ' + Math.round(performance.now() - T0) + ' ms');
}

/* JS port of the sky radiance (no sun disc) so fog colours match the dome exactly */
function skyColorJS(dir, sunDir, rayleigh, turbidity, mieCoeff, mieG){
  const totalRayleigh = [5.804542996261093e-6, 1.3562911419845635e-5, 3.0265902468824876e-5];
  const MieConst = [1.8399918514433978e14, 2.7798023919660528e14, 4.0790479543861094e14];
  const sunE = 1000 * Math.max(0, 1 - Math.exp(-((1.6110731556870734 - Math.acos(clampN(sunDir.y, -1, 1))) / 1.5)));
  const sunfade = 1 - clamp01(1 - Math.exp(sunDir.y));
  const rC = rayleigh - (1 - sunfade);
  const c = (0.2 * turbidity) * 10e-18;
  const zenith = Math.acos(Math.max(0, dir.y));
  const inverse = 1 / (Math.cos(zenith) + 0.15 * Math.pow(93.885 - zenith * 180 / Math.PI, -1.253));
  const sR = 8.4e3 * inverse, sM = 1.25e3 * inverse;
  const cosT = dir.dot(sunDir);
  const rPhase = 0.05968310365946075 * (1 + Math.pow(cosT * 0.5 + 0.5, 2));
  const g2 = mieG * mieG;
  const mPhase = 0.07957747154594767 * ((1 - g2) / Math.pow(1 - 2 * mieG * cosT + g2, 1.5));
  const mixF = clamp01(Math.pow(1 - sunDir.y, 5));
  const out = [0, 0, 0], bias = [0, 0.0003, 0.00075];
  for (let i = 0; i < 3; i++){
    const bR = totalRayleigh[i] * rC, bM = 0.434 * c * MieConst[i] * mieCoeff;
    const Fex = Math.exp(-(bR * sR + bM * sM));
    const bt = bR * rPhase + bM * mPhase, denom = bR + bM;
    let Lin = Math.pow(Math.max(0, sunE * (bt / denom) * (1 - Fex)), 1.5);
    Lin *= lerpN(1, Math.pow(Math.max(0, sunE * (bt / denom) * Fex), 0.5), mixF);
    const tex = (Lin + 0.1 * Fex) * 0.04 + bias[i];
    out[i] = Math.pow(Math.max(tex, 0), 1 / (1.2 + 1.2 * sunfade)) * skyUniforms.uSkyScale.value;
  }
  const l = out[0] * 0.2126 + out[1] * 0.7152 + out[2] * 0.0722;
  for (let i = 0; i < 3; i++) out[i] = Math.max(0, l + (out[i] - l) * 1.35);
  return out;
}

const boidP = [], boidV = [];
for (let i = 0; i < Q.birds; i++){
  boidP.push(new THREE.Vector3((Math.random()-0.5)*200, 110 + Math.random()*40, (Math.random()-0.5)*200));
  boidV.push(new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*2, (Math.random()-0.5)*10));
}
const _bd = new THREE.Object3D();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _steer = new THREE.Vector3();
function updateBoids(dt){
  const yMin = HMAX + 25, yMax = HMAX + 70;
  for (let i = 0; i < Q.birds; i++){
    const p = boidP[i], v = boidV[i];
    _v1.set(0,0,0); _v2.set(0,0,0); _v3.set(0,0,0);
    let nSep = 0, nNear = 0;
    for (let j = 0; j < Q.birds; j++){
      if (i === j) continue;
      const d2 = p.distanceToSquared(boidP[j]);
      if (d2 < 36){ _steer.subVectors(p, boidP[j]).multiplyScalar(1 / Math.max(d2, 1)); _v1.add(_steer); nSep++; }
      if (d2 < 900){ _v2.add(boidV[j]); _v3.add(boidP[j]); nNear++; }
    }
    if (nSep)  v.addScaledVector(_v1, 22 * dt);
    if (nNear){ _v2.divideScalar(nNear).sub(v); v.addScaledVector(_v2, 1.4 * dt);
                _v3.divideScalar(nNear).sub(p); v.addScaledVector(_v3, 0.8 * dt); }
    const r = Math.hypot(p.x, p.z);
    if (r > 160){ _steer.set(-p.x, 0, -p.z).normalize(); v.addScaledVector(_steer, (r - 160) * 0.05 * dt * 60); }
    if (p.y < yMin) v.y += (yMin - p.y) * 0.8 * dt;
    if (p.y > yMax) v.y -= (p.y - yMax) * 0.8 * dt;
    _steer.set(-p.z, 0, p.x).normalize();
    v.addScaledVector(_steer, 2.2 * dt);
    const sp = v.length();
    if (sp > 15) v.multiplyScalar(15 / sp);
    if (sp < 7 && sp > 0.01) v.multiplyScalar(7 / sp);
    p.addScaledVector(v, dt);
    _bd.position.copy(p);
    _v1.copy(p).add(v);
    _bd.lookAt(_v1);
    _bd.updateMatrix();
    birds.setMatrixAt(i, _bd.matrix);
  }
  birds.instanceMatrix.needsUpdate = true;
}

const rainUniforms = { uTime: U.uTime, uWindDir: U.uWindDir, uWindStrength: U.uWindStrength,
                       uCamPos: U.uCamPos, uRain: { value: 0 } };
const rain = (() => {
  const base = new THREE.PlaneGeometry(1, 1);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = base.index;
  geo.attributes.position = base.attributes.position;
  geo.attributes.uv = base.attributes.uv;
  const offs = new Float32Array(Q.rain * 3), spd = new Float32Array(Q.rain), len = new Float32Array(Q.rain);
  for (let i = 0; i < Q.rain; i++){
    offs[i*3] = (Math.random()*2-1) * 18; offs[i*3+1] = Math.random() * 44; offs[i*3+2] = (Math.random()*2-1) * 18;
    spd[i] = 22 + Math.random() * 12; len[i] = 0.5 + Math.random() * 0.9;
  }
  geo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(offs, 3));
  geo.setAttribute('aSpeed',  new THREE.InstancedBufferAttribute(spd, 1));
  geo.setAttribute('aLen',    new THREE.InstancedBufferAttribute(len, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: rainUniforms, transparent: true, depthWrite: false,
    vertexShader: /* glsl */`
      attribute vec3 aOffset; attribute float aSpeed; attribute float aLen;
      uniform float uTime, uWindStrength; uniform vec2 uWindDir; uniform vec3 uCamPos;
      varying vec2 vQ; varying float vDist;
      void main(){
        vQ = uv;
        const float BOX = 36.0, H = 44.0;
        float y = mod(aOffset.y - uTime * aSpeed, H);
        vec2 xz = uCamPos.xz + mod(aOffset.xz - uCamPos.xz + BOX * 0.5, BOX) - BOX * 0.5;
        vec3 wp = vec3(xz.x, uCamPos.y - H * 0.45 + y, xz.y);
        wp.xz += uWindDir * uWindStrength * (H - y) * 0.05;
        vec4 mv = viewMatrix * vec4(wp, 1.0);
        vDist = -mv.z;
        mv.x += position.x * (0.014 + vDist * 0.0035);
        mv.y += position.y * aLen * (0.7 + vDist * 0.03);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform float uRain; varying vec2 vQ; varying float vDist;
      void main(){
        float a = (1.0 - abs(vQ.x - 0.5) * 2.0) * sin(vQ.y * 3.14159) * 0.55 * uRain;
        a *= smoothstep(0.8, 3.0, vDist) * (1.0 - smoothstep(16.0, 30.0, vDist));
        gl_FragColor = vec4(vec3(0.70, 0.78, 0.88), a);
      }`
  });
  const m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false; m.visible = false;
  scene.add(m);
  return m;
})();

let splashMesh = null, motes = null, fireflies = null;
function buildSplashes(){
  const g = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);

  while (k < n && attempts++ < n * 20){
    const x = (rng() * 2 - 1) * 150, z = (rng() * 2 - 1) * 150;
    if (Math.hypot(x, z) > 150 || nearestTrunk(x, z) < 0.5) continue;
    const h = heightFn(x, z);
    if (h < WATER_LEVEL) continue;
    pos[k*3] = x; pos[k*3+1] = h + 0.03; pos[k*3+2] = z; ph[k] = rng(); k++;
  }
  geo.instanceCount = k;
  geo.setAttribute('aPos', new THREE.InstancedBufferAttribute(pos, 3));
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(ph, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uRain: rainUniforms.uRain, uTex: { value: ringTex } },
    transparent: true, depthWrite: false,
    vertexShader: /* glsl */`
      attribute vec3 aPos; attribute float aPhase;
      uniform float uTime; varying vec2 vUv; varying float vA;
      void main(){
        vUv = uv;
        float ph = fract(uTime * 1.3 + aPhase * 7.0);
        float sc = 0.04 + ph * 0.17;
        vec3 wp = aPos + position * sc;
        vA = (1.0 - ph) * step(0.02, ph);
        gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D uTex; uniform float uRain; varying vec2 vUv; varying float vA;
      void main(){ float a = texture2D(uTex, vUv).r * vA * uRain * 0.28; gl_FragColor = vec4(vec3(0.75, 0.8, 0.85), a); }`
  });
  splashMesh = new THREE.Mesh(geo, mat);
  splashMesh.frustumCulled = false; splashMesh.visible = false;
  worldGroup.add(splashMesh);
}

    const mat = new THREE.ShaderMaterial({

                  uSize: { value: size }, uWindDir: U.uWindDir },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: /* glsl */`
        attribute float aSeed; uniform float uTime, uSize; uniform vec2 uWindDir;
        varying float vA;
        void main(){
          vec3 p = position;
          ${kind === 'mote'
            ? `p.x += sin(uTime * 0.35 + aSeed * 40.0) * 0.6 + uWindDir.x * uTime * 0.05 * aSeed;
               p.y += sin(uTime * 0.5 + aSeed * 90.0) * 0.4;
               p.z += cos(uTime * 0.3 + aSeed * 60.0) * 0.6;
               vA = 0.35 + 0.35 * sin(uTime * 1.3 + aSeed * 70.0);`
            : `p.x += sin(uTime * 0.6 + aSeed * 40.0) * 0.9;
               p.y += sin(uTime * 0.9 + aSeed * 90.0) * 0.35;
               p.z += cos(uTime * 0.5 + aSeed * 60.0) * 0.9;
               vA = smoothstep(0.55, 1.0, sin(uTime * (1.5 + aSeed * 2.0) + aSeed * 100.0));`}
          vec4 mv = viewMatrix * vec4(p, 1.0);
          float d = max(-mv.z, 0.5);
          vA *= (1.0 - smoothstep(25.0, 60.0, d)) * smoothstep(0.3, 1.5, d);
          gl_PointSize = uSize / d * ${kind === 'mote' ? '1.0' : '1.6'};
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        uniform sampler2D uTex; uniform vec3 uColor; uniform float uVis; varying float vA;
        void main(){ float a = texture2D(uTex, gl_PointCoord).r * vA * uVis; gl_FragColor = vec4(uColor * a, a); }`
    });
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    worldGroup.add(pts);
    return pts;
  };
  motes = mk(Q.motes, 70, 0.4, 9, 0xffe3b0, 90, 'mote');
  fireflies = mk(Q.fireflies, 130, 0.3, 2.6, 0xd8ff5a, 160, 'firefly');
}

/* ================================ weather machine ================================== */
const WEATHER = {
  Clear:  { cover: 0.22, dark: 0.10, sunI: 1.00, turb: 3.2, wind: 0.55, rain: 0.00, wet: 0.00, expo: 1.00, hemi: 1.00 },
  Cloudy: { cover: 0.62, dark: 0.40, sunI: 0.50, turb: 8,  wind: 0.95, rain: 0.00, wet: 0.10, expo: 0.96, hemi: 0.85 },
  Rain:   { cover: 0.86, dark: 0.62, sunI: 0.22, turb: 11, wind: 1.40, rain: 0.75, wet: 0.85, expo: 0.92, hemi: 0.65 },
  Storm:  { cover: 1.00, dark: 0.90, sunI: 0.08, turb: 16, wind: 2.20, rain: 1.00, wet: 1.00, expo: 0.86, hemi: 0.45 }
};
const CYCLE = ['Clear', 'Cloudy', 'Rain', 'Storm', 'Cloudy', 'Clear'];
const weather = {
  cur: { ...WEATHER.Clear }, from: { ...WEATHER.Clear }, to: WEATHER.Clear,
  t: 1, dur: 25, cycleIdx: 0, holdTimer: 40,
  set(name){ this.from = { ...this.cur }; this.to = WEATHER[name]; this.t = 0; this.dur = 20 + Math.random() * 20; },
  update(dt, autoCycle){
    if (this.t < 1){
      this.t = Math.min(1, this.t + dt / this.dur);
      const s = this.t * this.t * (3 - 2 * this.t);
      for (const k in this.cur) this.cur[k] = lerpN(this.from[k], this.to[k], s);
    } else if (autoCycle){
      this.holdTimer -= dt;
      if (this.holdTimer <= 0){
        this.cycleIdx = (this.cycleIdx + 1) % CYCLE.length;
        this.set(CYCLE[this.cycleIdx]);
        this.holdTimer = 25 + Math.random() * 20;
      }
    }
  }
};
let flashPower = 0, flashTimer = 4;
function updateLightning(dt){
  if (weather.cur.dark > 0.8){
    flashTimer -= dt;
    if (flashTimer <= 0){
      flashPower = 4 + Math.random() * 6;
      flashTimer = 2 + Math.random() * 8;
      lightningLight.position.set((Math.random()-0.5)*400, 300, (Math.random()-0.5)*400);
    }
  }
  flashPower *= Math.exp(-dt * 9);
  lightningLight.intensity = flashPower;
}

/* ================================= post-processing ================================= */
/* Screen-space god rays: bright-pass the HDR frame, radially blur toward the sun,
   add back. Only active while the sun is in front of the camera and above the horizon. */
class GodRaysPass extends Pass {
  constructor(w, h){
    super();
    this.needsSwap = true;
    const o = { type: THREE.HalfFloatType, depthBuffer: false };
    this.rtA = new THREE.WebGLRenderTarget(Math.floor(w / 2), Math.floor(h / 2), o);
    this.rtB = new THREE.WebGLRenderTarget(Math.floor(w / 2), Math.floor(h / 2), o);
    this.sun = new THREE.Vector2(0.5, 0.5);
    this.intensity = 0;
    this.color = new THREE.Color(1, 0.9, 0.7);
    this.maskMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uSun: { value: this.sun }, uThreshold: { value: 0.9 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uThreshold; varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          float m = smoothstep(uThreshold, uThreshold * 2.2, l);
          m *= 1.0 - smoothstep(0.25, 0.75, distance(vUv, uSun));
          gl_FragColor = vec4(c * m, 1.0);
        }`
    });
    this.blurMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uSun: { value: this.sun }, uDensity: { value: 0.92 }, uDecay: { value: 0.965 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uDensity, uDecay; varying vec2 vUv;
        void main(){
          const int N = 28;
          vec2 delta = (uSun - vUv) * uDensity / float(N);
          vec2 uv = vUv; vec3 acc = vec3(0.0); float w = 1.0, tot = 0.0;
          for (int i = 0; i < N; i++){ uv += delta; acc += texture2D(tDiffuse, uv).rgb * w; tot += w; w *= uDecay; }
          gl_FragColor = vec4(acc / tot, 1.0);
        }`
    });
    this.compMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, tRays: { value: null }, uIntensity: { value: 0 }, uColor: { value: this.color } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse, tRays; uniform float uIntensity; uniform vec3 uColor; varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          vec3 r = texture2D(tRays, vUv).rgb;
          gl_FragColor = vec4(c + r * uColor * uIntensity, 1.0);
        }`
    });
    this.quad = new FullScreenQuad(null);
  }
  setSize(w, h){ this.rtA.setSize(Math.floor(w / 2), Math.floor(h / 2)); this.rtB.setSize(Math.floor(w / 2), Math.floor(h / 2)); }
  render(renderer, writeBuffer, readBuffer){
    this.quad.material = this.maskMat; this.maskMat.uniforms.tDiffuse.value = readBuffer.texture;
    renderer.setRenderTarget(this.rtA); this.quad.render(renderer);
    this.quad.material = this.blurMat;
    this.blurMat.uniforms.tDiffuse.value = this.rtA.texture; renderer.setRenderTarget(this.rtB); this.quad.render(renderer);
    this.blurMat.uniforms.tDiffuse.value = this.rtB.texture; renderer.setRenderTarget(this.rtA); this.quad.render(renderer);
    this.quad.material = this.compMat;
    this.compMat.uniforms.tDiffuse.value = readBuffer.texture;
    this.compMat.uniforms.tRays.value = this.rtA.texture;
    this.compMat.uniforms.uIntensity.value = this.intensity;
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.quad.render(renderer);
  }
}

const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight,
  { samples: HAS_WEBGL2 ? 4 : 0, type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, renderTarget);
composer.addPass(new RenderPass(scene, camera));

/* AO camera mirrors the main camera but skips foliage layers (cutout cards would
   otherwise occlude as solid rectangles) */
const aoCam = new THREE.PerspectiveCamera(camera.fov, camera.aspect, camera.near, camera.far);
aoCam.layers.set(0); aoCam.layers.enable(1);
aoCam.matrixAutoUpdate = false; aoCam.matrixWorldAutoUpdate = false;
let gtaoPass = null;
if (Q.ao){
  gtaoPass = new GTAOPass(scene, aoCam, window.innerWidth, window.innerHeight);
  gtaoPass.output = GTAOPass.OUTPUT.Default;
  gtaoPass.updateGtaoMaterial({ radius: 0.7, distanceExponent: 1.0, thickness: 0.8, scale: 1.0, samples: 12, distanceFallOff: 1.0, screenSpaceRadius: false });
  gtaoPass.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, radiusExponent: 1, rings: 3, samples: 12 });
  gtaoPass.blendIntensity = 0.75;
  composer.addPass(gtaoPass);
}
const godRays = new GodRaysPass(window.innerWidth, window.innerHeight);
composer.addPass(godRays);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.16, 0.5, 0.88);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ===================================== GUI ========================================= */
const qpAll = new URLSearchParams(location.search);
const qpNoSun = qpAll.has('nosun'), qpNoEnv = qpAll.has('noenv'), qpBench = qpAll.has('bench');
if (qpBench) renderer.info.autoReset = false;
const params = {
  timeOfDay: 9.2, weather: 'Clear', autoCycle: true, wind: 1.0, mist: 0.12, seed: 1337,
  ao: Q.ao, godRays: 0.55, bloom: 0.16, exposure: 0.8,
  regenerate(){ showLoading(true); setTimeout(() => { rebuildWorld(Math.floor(params.seed)); buildSplashes(); buildPoints(); placeCamera(); showLoading(false); }, 30); }
};
const gui = new GUI({ title: 'Forest' });
gui.add(params, 'timeOfDay', 0, 24, 0.05).name('Sun time');
gui.add(params, 'weather', Object.keys(WEATHER)).name('Weather')
   .onChange(v => { params.autoCycle = false; weather.set(v); gui.controllers.find(c => c.property === 'autoCycle')?.updateDisplay(); });
gui.add(params, 'autoCycle').name('Auto-cycle');
gui.add(params, 'wind', 0, 3, 0.01).name('Wind');
gui.add(params, 'mist', 0, 1, 0.01).name('Mist');
gui.add(params, 'seed', 1, 999999, 1).name('Seed');
gui.add(params, 'regenerate').name('Regenerate world');
params.viewPrideRock = () => {
  const [px, pz] = PATH_POINTS[PATH_POINTS.length - 1];
  camera.position.set(px - 6, heightFn(px - 6, pz + 14) + 1.75, pz + 14);
  controls.target.set(PR.x - 10, savPlainH + 30, PR.z);
  controls.update(); lastInteraction = performance.now();
};
gui.add(params, 'viewPrideRock').name('View: Pride Rock');
if (gtaoPass) gui.add(params, 'ao').name('Ambient occlusion').onChange(v => { gtaoPass.enabled = v; });
gui.add(params, 'godRays', 0, 1.5, 0.01).name('God rays');
gui.add(params, 'bloom', 0, 1, 0.01).name('Bloom').onChange(v => { bloomPass.strength = v; });
gui.add(params, 'exposure', 0.3, 1.2, 0.01).name('Exposure');

function showLoading(on){ document.getElementById('load').style.display = on ? 'grid' : 'none'; }

/* ================================ sun / sky update ================================= */
const _sunDir = new THREE.Vector3(), _tmpDir = new THREE.Vector3(), _fwd = new THREE.Vector3(), _proj = new THREE.Vector3();
const _col = new THREE.Color();
function updateSun(){
  const t = params.timeOfDay;
  const elev = Math.sin((t - 6) / 12 * Math.PI);
  const azim = (t / 24) * Math.PI * 2 - Math.PI / 2;
  const horiz = Math.sqrt(Math.max(0.001, 1 - elev * elev));
  _sunDir.set(Math.cos(azim) * horiz, elev, Math.sin(azim) * horiz).normalize();
  U.uSunDirW.value.copy(_sunDir);
  U.uSunDirV.value.copy(_sunDir).transformDirection(camera.matrixWorldInverse);

  const day = smoothstepJS(-0.04, 0.14, elev);
  const night = smoothstepJS(0.02, -0.10, elev);
  const warm = smoothstepJS(0.40, 0.02, elev);
  const sunCol = _col.setRGB(1, lerpN(0.98, 0.62, warm), lerpN(0.94, 0.32, warm));
  const sunI = weather.cur.sunI * day;
  /* after dusk the key light becomes the moon: opposite the sun, dim and blue */
  const moonI = 0.10 * night * (1 - weather.cur.cover * 0.8);
  if (night > 0.5){
    _tmpDir.set(-_sunDir.x, Math.max(0.25, -_sunDir.y), -_sunDir.z).normalize();
    csm.lightDirection.copy(_tmpDir).negate();
    for (const l of csm.lights){ l.color.setRGB(0.62, 0.72, 1.0); l.intensity = moonI * 3.6; }
    U.uSunDirW.value.copy(_tmpDir);
    U.uSunDirV.value.copy(_tmpDir).transformDirection(camera.matrixWorldInverse);
  } else {
    csm.lightDirection.copy(_sunDir).negate();
    for (const l of csm.lights){ l.color.copy(sunCol); l.intensity = 3.6 * sunI; }
  }
  U.uSunColor.value.copy(sunCol);
  U.uSunI.value = sunI;
  if (qpNoSun) for (const l of csm.lights) l.intensity = 0;

  /* sky shader state */
  skyUniforms.uSunPos.value.copy(_sunDir).multiplyScalar(450000);
  skyUniforms.uTurbidity.value      = weather.cur.turb;
  skyUniforms.uRayleigh.value       = clampN(3.0 - weather.cur.cover * 1.4, 0.5, 3);
  skyUniforms.uMieCoefficient.value = 0.0045 + weather.cur.rain * 0.004;
  skyUniforms.uStarVis.value = smoothstepJS(0.05, -0.08, elev) * (1 - weather.cur.cover * 0.85);
  skyUniforms.uCover.value = weather.cur.cover;
  skyUniforms.uDark.value  = weather.cur.dark;

  /* fog colours sampled from the same sky model (horizon, sideways and sunward) */
  const ray = skyUniforms.uRayleigh.value, turb = skyUniforms.uTurbidity.value, mie = skyUniforms.uMieCoefficient.value;
  const side = _tmpDir.set(-_sunDir.z, 0.04, _sunDir.x).normalize();
  const hz = skyColorJS(side, _sunDir, ray, turb, mie, 0.76);
  const toward = _tmpDir.set(_sunDir.x, 0.05, _sunDir.z).normalize();
  const sw = skyColorJS(toward, _sunDir, ray, turb, mie, 0.76);
  const gloom = 1 - weather.cur.dark * 0.55;
  U.uHorizonColor.value.setRGB(hz[0] * gloom + 0.012 * (1 - day), hz[1] * gloom + 0.02 * (1 - day), hz[2] * gloom + 0.045 * (1 - day));
  /* damp forest air is a little green; overcast greys it */
  U.uHorizonColor.value.lerp(_col.setRGB(0.36, 0.42, 0.36).multiplyScalar(U.uHorizonColor.value.r + U.uHorizonColor.value.g + U.uHorizonColor.value.b).multiplyScalar(0.33), 0.12 + weather.cur.cover * 0.3);
  U.uSunHazeColor.value.setRGB(sw[0] * gloom + 0.012 * (1 - day), sw[1] * gloom + 0.02 * (1 - day), sw[2] * gloom + 0.045 * (1 - day));
  const dawnMist = Math.exp(-Math.pow((t - 6.9) / 1.3, 2)) * 0.30 * (1 - weather.cur.cover * 0.5);
  U.uFogDensity.value = 0.00055 + weather.cur.cover * 0.0008 + weather.cur.rain * 0.0020 + params.mist * 0.0022;
  U.uGroundMist.value = params.mist * 0.9 + weather.cur.rain * 0.28 + dawnMist;
  U.uSkyLight.value.copy(U.uHorizonColor.value);

  /* clouds lit by the same sun */
  const hzLum = hz[0] * 0.2126 + hz[1] * 0.7152 + hz[2] * 0.0722;
  skyUniforms.uCloudSun.value.copy(sunCol).multiplyScalar(clampN(hzLum * 4.0, 0.01, 0.9) * (0.4 + 0.6 * day) + 0.004);
  skyUniforms.uCloudShade.value.copy(U.uHorizonColor.value).multiplyScalar(0.85);
  skyUniforms.uGroundBounce.value.copy(U.uHorizonColor.value).multiply(_col.setRGB(0.30, 0.36, 0.20));

  /* ambient */
  hemiLight.color.copy(U.uHorizonColor.value).multiplyScalar(1.4);
  hemiLight.groundColor.setRGB(0.16, 0.19, 0.10).multiplyScalar(0.3 + day * 0.7);
  hemiLight.intensity = (0.04 + 0.08 * day) * weather.cur.hemi;
  hemiLight.color.lerp(_col.setRGB(0.25, 0.32, 0.55), night);
  scene.environmentIntensity = (qpNoEnv ? 0 : 1.15) * weather.cur.hemi;
  /* eye adaptation: open up at night, never so far that noon blows out */
  renderer.toneMappingExposure = params.exposure * weather.cur.expo * lerpN(1.0, 2.6, night);

  /* god rays: sun screen position and strength */
  camera.getWorldDirection(_fwd);
  const facing = _fwd.dot(_sunDir);
  _proj.copy(camera.position).addScaledVector(_sunDir, 1000).project(camera);
  godRays.sun.set(_proj.x * 0.5 + 0.5, _proj.y * 0.5 + 0.5);
  const inView = facing > 0.05 && Math.abs(_proj.x) < 1.6 && Math.abs(_proj.y) < 1.6;
  const strength = params.godRays * sunI * (1 - weather.cur.cover * 0.85) * smoothstepJS(0.05, 0.35, facing) * (inView ? 1 : 0);
  godRays.intensity = strength;
  godRays.enabled = strength > 0.005;
  godRays.color.copy(sunCol);
  const swLum = sw[0] * 0.2126 + sw[1] * 0.7152 + sw[2] * 0.0722;
  godRays.maskMat.uniforms.uThreshold.value = clampN(swLum * 0.45, 0.01, 1.0);

  /* particles */
  if (motes) motes.material.uniforms.uVis.value = 0.55 * sunI * (1 - weather.cur.cover);
  if (fireflies) fireflies.material.uniforms.uVis.value = smoothstepJS(0.06, -0.06, elev) * (1 - weather.cur.rain);
}

/* =============================== resize / context loss ============================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.setSize(window.innerWidth, window.innerHeight);
  godRays.setSize(window.innerWidth, window.innerHeight);
  if (gtaoPass) gtaoPass.setSize(window.innerWidth, window.innerHeight);
  csm.updateFrustums();
});
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  document.getElementById('msg').style.display = 'flex';
});

/* ================================== main loop ====================================== */
const fpsEl = document.getElementById('fps');
let frames = 0, fpsClock = 0, prev = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  U.uTime.value += dt;
  weather.update(dt, params.autoCycle);
  U.uWetness.value      = weather.cur.wet;
  U.uWindStrength.value = weather.cur.wind * params.wind;
  rainUniforms.uRain.value = weather.cur.rain;
  rain.visible = weather.cur.rain > 0.01;
  if (splashMesh) splashMesh.visible = rain.visible;
  updateLightning(dt);

  controls.autoRotate = (performance.now() - lastInteraction) > 9000;
  controls.autoRotateSpeed = -0.12;
  controls.update();
  const minY = heightFn(camera.position.x, camera.position.z) + 1.2;
  if (camera.position.y < minY) camera.position.y = minY;
  camera.updateMatrixWorld();
  U.uCamPos.value.copy(camera.position);

  updateSun();
  updateBoids(dt);
  csm.update();
  envTimer += dt;
  if (envTimer > 0.7){ envTimer = 0; refreshEnvironment(false); }

  aoCam.matrixWorld.copy(camera.matrixWorld);
  aoCam.matrixWorldInverse.copy(camera.matrixWorldInverse);
  aoCam.projectionMatrix.copy(camera.projectionMatrix);
  aoCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
  aoCam.near = camera.near; aoCam.far = camera.far;

  frames++; fpsClock += dt;
  if (fpsClock >= 0.5){ fpsEl.textContent = Math.round(frames / fpsClock) + ' FPS'; frames = 0; fpsClock = 0; }
  const tR = performance.now();
  composer.render();
  if (qpBench){
    benchN++; benchT += performance.now() - tR;
    if (benchN === 3 || benchN === 10 || benchN === 20){ console.log('[bench] frame ' + benchN + ' last render ms ' + (performance.now() - tR).toFixed(1) + ' calls ' + renderer.info.render.calls + ' tris ' + renderer.info.render.triangles + ' t=' + Math.round(performance.now())); }
    renderer.info.reset();
  }
}
let benchN = 0, benchT = 0;

/* ==================================== kick off ===================================== */
function placeCamera(){
  const [ax, az] = PATH_POINTS[2], [bx, bz] = PATH_POINTS[4];
  const sx = ax + 3, sz = az + 6;
  camera.position.set(sx, heightFn(sx, sz) + 1.75, sz);
  controls.target.set(bx, heightFn(bx, bz) + 1.6, bz);
  controls.update();
}
rebuildWorld(params.seed);
buildSplashes();
buildPoints();
placeCamera();
weather.set('Clear');
{
  /* shareable views: ?cx=&cy=&cz=&tx=&ty=&tz=&rel=1&tod=&w=&mist= */
  const qp = new URLSearchParams(location.search);
  if (qp.has('cx')){
    const rel = qp.has('rel');
    const cx = +qp.get('cx'), cz = +qp.get('cz'), tx = +qp.get('tx'), tz = +qp.get('tz');
    camera.position.set(cx, +qp.get('cy') + (rel ? heightFn(cx, cz) : 0), cz);
    controls.target.set(tx, +qp.get('ty') + (rel ? heightFn(tx, tz) : 0), tz);
    controls.update();
    lastInteraction = 1e15;
  }
  if (qp.has('pride')){ params.viewPrideRock(); lastInteraction = 1e15; }
  if (qp.has('tod')) params.timeOfDay = +qp.get('tod');
  if (qp.has('mist')) params.mist = +qp.get('mist');
  if (qp.has('w')){ const n = qp.get('w'); params.autoCycle = false; weather.cur = { ...WEATHER[n] }; weather.from = { ...weather.cur }; weather.to = WEATHER[n]; weather.t = 1; }
  if (qp.has('nogui')){ gui.hide(); fpsEl.style.display = 'none'; document.getElementById('hint').style.display = 'none'; }
}
camera.updateMatrixWorld();
updateSun();
refreshEnvironment(true);
csm.updateFrustums();
showLoading(false);
requestAnimationFrame((t) => { prev = t; animate(t); });
</script>
